<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inserisci Nuova Pianta - La Teca del Giardiniere</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 80%;
            max-width: 600px;
        }
        h1 {
            color: #388e3c; /* Verde scuro */
            text-align: center;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"],
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            margin-bottom: 10px;
            font-size: 16px;
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        button[type="submit"] {
            background-color: #4CAF50; /* Verde */
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease;
            width: 100%;
        }
        button[type="submit"]:hover {
            background-color: #388e3c;
        }
        .back-link {
            margin-top: 20px;
            text-align: center;
        }
        .back-link a {
            text-decoration: none;
            color: #007bff;
        }
        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Inserisci una nuova pianta</h1>
        <form action="pianteServlet" method="post">
            <div class="form-group">
                <label for="nomeComune">Nome Comune:</label>
                <input type="text" id="nomeComune" name="nomeComune" required>
            </div>
            <div class="form-group">
                <label for="tipo">Tipo (true/false):</label>
                <input type="text" id="tipo" name="tipo">
            </div>
            <div class="form-group">
                <label for="NomeScientificoBotanico">Nome Scientifico:</label>
                <input type="text" id="NomeScientificoBotanico" name="NomeScientificoBotanico">
            </div>
            <div class="form-group">
                <label for="Categoria">Categoria:</label>
                <input type="text" id="Categoria" name="Categoria">
            </div>
            <div class="form-group">
                <label for="DescrizioneBreve">Descrizione Breve:</label>
                <input type="text" id="DescrizioneBreve" name="DescrizioneBreve">
            </div>
            <div class="form-group">
                <label for="DescrizioneDettagliata">Descrizione Dettagliata:</label>
                <textarea id="DescrizioneDettagliata" name="DescrizioneDettagliata"></textarea>
            </div>
            <div class="form-group">
                <label for="EsposizioneLuminosa">Esposizione:</label>
                <input type="text" id="EsposizioneLuminosa" name="EsposizioneLuminosa">
            </div>
            <div class="form-group">
                <label for="TipoDiTerreno">Tipo di Terreno:</label>
                <input type="text" id="TipoDiTerreno" name="TipoDiTerreno">
            </div>
            <div class="form-group">
                <label for="TemperaturaIdeale">Temperatura Ideale:</label>
                <input type="text" id="TemperaturaIdeale" name="TemperaturaIdeale">
            </div>
            <div class="form-group">
                <label for="FrequenzaIrrigazione">Frequenza Irrigazione:</label>
                <input type="text" id="FrequenzaIrrigazione" name="FrequenzaIrrigazione">
            </div>
            <div class="form-group">
                <label for="Prezzo">Prezzo:</label>
                <input type="text" id="Prezzo" name="Prezzo">
            </div>
            <div class="form-group">
                <label for="Disponibilita">Disponibilità:</label>
                <input type="text" id="Disponibilita" name="Disponibilita">
            </div>
            <div class="form-group">
                <label for="data_inserimento">Data Inserimento (yyyy-mm-dd hh:mm:ss):</label>
                <input type="text" id="data_inserimento" name="data_inserimento">
            </div>
            <button type="submit">Inserisci Pianta</button>
        </form>
        <div class="back-link">
            <a href="index.html">Torna alla Home</a>
        </div>
    </div>
</body>
</html>
